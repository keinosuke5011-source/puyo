function mulberry32(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
class Sequence {
  constructor(n) {
    this.rnd = mulberry32((Math.random() * 4294967296) >>> 0);
    this.pal = []; for (let i = 1; i <= n; i++) this.pal.push(i);
    const early = this.shuffle(this.pal.slice()).slice(0, Math.min(3, n));
    this.buf = this.shuffle([...early, ...early]);
    this.list = [];
  }
  shuffle(a) {
    for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(this.rnd() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
    return a;
  }
  refill() {
    const bag = []; for (const c of this.pal) for (let k = 0; k < 8; k++) bag.push(c);
    this.buf = this.shuffle(bag);
  }
  get(i) {
    while (this.list.length <= i) {
      if (this.buf.length < 2) this.refill();
      this.list.push([this.buf.pop(), this.buf.pop()]);
    }
    return this.list[i];
  }
}

  checkErase() {

  startErase(groups) {

  popBurst(e) {

  boardEmpty() {

  }
  chainEnd() {

  after(frames, fn) { this.later.push({ t: frames, fn }); }
  chainAnim(ch, cx, cy) {

        this.rings.push({ x: fx, y: fy, t: 0, life: 16, color: cc, r1: 50 });
        const n = N(22);

        }

    }

  }
  drawChainFx() {
    for (const w of this.waves) {
      const k = w.t / w.life, y = FIELD_H * (1 - k) - 20;
      const g = ctx.createLinearGradient(0, y - 40, 0, y + 40);
      const a = Math.sin(Math.PI * k) * 0.55;
      for (let i = 0; i <= 6; i++) g.addColorStop(i / 6, hexA(hsl2hex(i * 60 + w.t * 8), i === 0 || i === 6 ? 0 : a));

  updateChainFx() {

}

    text(String(p.sentTotal), cxm, iy + 94, 20, '#fff', 'center');
  } else {
    text('レベル', cxm, iy + 70, 12, '#9fa6e0', 'center', false);
    text(String(p.level()), cxm, iy + 94, 20, '#fff', 'center');
  }
  if (p.zenkeshi) { ctx.save(); ctx.globalAlpha = 0.75 + 0.25 * Math.sin(game.frame * 0.2); text('全消し', cxm, iy + 128, 14, '#ffe14d', 'center'); text('ボーナス待機', cxm, iy + 146, 11, '#ffe14d', 'center', false); ctx.restore(); }
}

function drawScore(p) {
  const x = p.fx, w = FIELD_W, y = FY + FIELD_H + 18;
  panel(x - 5, y, w + 10, 64);
  text('SCORE', x + 6, y + 22, 13, '#9fa6e0');
  const s = String(Math.min(p.score, 99999999)), pad = s.padStart(8, '0');
  ctx.font = `bold 34px 'Courier New',monospace`; ctx.textAlign = 'right';
  ctx.fillStyle = '#3a3f70'; ctx.fillText(pad, x + w - 6, y + 54);
  ctx.fillStyle = '#ffffff'; ctx.fillText(s, x + w - 6, y + 54);
}

function drawPlayer(p) {
  ctx.save();
  if (p.shake > 0 && settings.shake) ctx.translate((Math.random() - 0.5) * p.shake, (Math.random() - 0.5) * p.shake);
  ctx.textBaseline = 'alphabetic';
  text(p.label, p.fx, 26, 18, p.color);
  if (p.showWins) text('WIN ' + game.wins[p.idx], p.fx + FIELD_W, 26, 18, p.color, 'right');
  drawOjamaBar(p);
  drawField(p);
  drawSide(p);
  drawScore(p);
  ctx.restore();
}

function drawCutin(p) {
  const c = p.cutin; if (!c) return;
  const left = !p.vs || p.idx === 0;
  const x0 = p.vs ? (p.idx === 0 ? 0 : 500) : 0, w = p.vs ? 500 : 1000;
  const tier = c.zen ? 3 : cutTier(c.chain);
  const bandH = tier === 0 ? 96 : 150, cy = FY + 250, top = cy - bandH / 2;
  const inK = Math.min(1, c.t / 8), outK = c.t > c.life - 8 ? (c.t - (c.life - 8)) / 8 : 0;
  const slide = Math.pow(1 - inK, 3) * (left ? -1 : 1) * w * 0.7;
  const col = c.zen ? '#ffe14d' : chainColor(c.chain);
  const px = left ? x0 + (w > 600 ? 250 : 112) : x0 + w - 112, tx = left ? x0 + (w > 600 ? 640 : 322) : x0 + w - 322;
  ctx.save();
  ctx.beginPath(); ctx.rect(x0, top, w, bandH); ctx.clip();
  ctx.globalAlpha = 1 - outK;
  const g = ctx.createLinearGradient(0, top, 0, top + bandH);
  g.addColorStop(0, hexA(col, 0.65)); g.addColorStop(0.5, 'rgba(10,10,44,0.9)'); g.addColorStop(1, hexA(col, 0.65));
  ctx.fillStyle = g; ctx.fillRect(x0, top, w, bandH);
  ctx.fillStyle = 'rgba(255,255,255,0.08)';
  for (let i = -2; i < w / 50 + 3; i++) {
    const sx = x0 + i * 50 + ((c.t * (left ? 7 : -7)) % 50);
    ctx.beginPath(); ctx.moveTo(sx, top + bandH); ctx.lineTo(sx + 26, top + bandH); ctx.lineTo(sx + 26 + bandH * 0.5, top); ctx.lineTo(sx + bandH * 0.5, top); ctx.closePath(); ctx.fill();
  }
  ctx.strokeStyle = 'rgba(255,255,255,0.4)'; ctx.lineWidth = 2;
  for (let i = 0; i < 24; i++) {
    const a = i / 24 * Math.PI * 2 + c.t * 0.02, r0 = 56 + ((i * 37 + c.t * 15) % 90), r1 = r0 + 50 + ((i * 53) % 80);
    ctx.beginPath(); ctx.moveTo(px + slide + Math.cos(a) * r0, cy + Math.sin(a) * r0 * 0.6); ctx.lineTo(px + slide + Math.cos(a) * r1, cy + Math.sin(a) * r1 * 0.6); ctx.stroke();
  }
  const pop = 1 + 0.3 * Math.max(0, 1 - c.t / 10), bounce = Math.max(0, 1 - c.t / 18) * Math.cos(c.t * 0.9);
  ctx.save(); ctx.translate(px + slide, cy); ctx.rotate((left ? -1 : 1) * 0.14 + Math.sin(c.t * 0.5) * 0.03 * tier);
  ctx.scale(1 + 0.3 * bounce, 1 - 0.26 * bounce);
  drawPuyo(0, 0, c.color, (bandH * 0.9) * pop, false); ctx.restore();
  const label = c.zen ? 'ぜんけし!!' : `${c.chain}連鎖!`, fs = (c.zen ? 50 : 46) + tier * 8;
  const jx = c.t < 12 ? (Math.random() - 0.5) * (4 + tier * 2) : 0;
  ctx.font = `900 ${fs}px ${FONT}`; ctx.textAlign = 'center';
  const tw = ctx.measureText(label).width;
  ctx.lineJoin = 'round'; ctx.lineWidth = 10; ctx.strokeStyle = 'rgba(15,5,40,0.95)';
  const ty = cy + (tier === 0 ? 14 : 4);
  ctx.strokeText(label, tx + slide * 0.5 + jx, ty);
  let fill = '#ffffff';
  if (tier >= 3) { const lg = ctx.createLinearGradient(tx - tw / 2, 0, tx + tw / 2, 0); for (let i = 0; i <= 5; i++) lg.addColorStop(i / 5, hsl2hex((game.frame * 10 + i * 60) % 360)); fill = lg; }
  else if (tier >= 1) fill = col;
  ctx.fillStyle = fill; ctx.fillText(label, tx + slide * 0.5 + jx, ty);
  if (tier >= 1) text(c.zen ? 'ALL CLEAR!' : CUT_TEXT[tier], tx + slide * 0.5, cy + bandH / 2 - 16, 18, '#ffffff', 'center');
  ctx.restore();
  ctx.save(); ctx.globalAlpha = 1 - outK; ctx.fillStyle = col;
  ctx.fillRect(x0, top - 3, w, 3); ctx.fillRect(x0, top + bandH, w, 3);
  ctx.restore();
}

function drawShots() {
  for (const s of game.shots) {
    const col = chainColor(Math.max(2, s.from ? s.from.chain : 2));
    for (let i = 0; i < s.trail.length; i++) {
      const [x, y] = s.trail[i], k = (i + 1) / s.trail.length;
      ctx.globalAlpha = k * 0.65; ctx.fillStyle = col; circle(x, y, (3 + Math.min(11, s.n * 0.6)) * k);
    }
    ctx.globalAlpha = 1;
    ctx.save(); ctx.shadowColor = col; ctx.shadowBlur = 24;
    drawPuyo(s.x, s.y, OJAMA, 26 + Math.min(22, s.n * 1.4), false);
    ctx.restore();
    text('+' + s.n, s.x + 20, s.y - 14, 16, '#ffffff', 'left');
  }
  for (const q of game.sparks) { ctx.globalAlpha = q.life / q.max; ctx.fillStyle = q.color; circle(q.x, q.y, q.r * q.life / q.max); }
  ctx.globalAlpha = 1;
}

function drawBackground() {
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, '#1a1f55'); g.addColorStop(1, '#0a0c24');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  for (const b of game.bubbles) {
    const y = ((b.y - game.frame * b.s) % (H + 40) + H + 40) % (H + 40) - 20, x = b.x + Math.sin(game.frame * 0.01 + b.ph) * 14;
    ctx.fillStyle = 'rgba(160,180,255,0.08)'; circle(x, y, b.r);
  }
  for (const p of game.players) {
    if (p.glow < 0.05) continue;
    const cx = p.fx + FIELD_W / 2, cy = FY + FIELD_H / 2, col = chainColor(p.glowN);
    const rg = ctx.createRadialGradient(cx, cy, 40, cx, cy, 460);
    rg.addColorStop(0, hexA(col, 0.34 * p.glow)); rg.addColorStop(1, hexA(col, 0));
    ctx.fillStyle = rg; ctx.fillRect(0, 0, W, H);
  }
}

function menuDetail() {
  const m = settings.mode;
  if (m === 'cpu') return ['CPUの強さ', `Lv.${settings.cpuLevel}  ${CPU_LV[settings.cpuLevel].name}`, false];
  if (m === 'tower') {
    const f = Math.min(settings.towerFloor, towerMaxSel()), i = towerInfo(f);
    return ['スタートする階', `${f}F  ${i.type === 'mission' ? 'ミッション' : (i.boss ? 'ボス ' : '') + i.name} (到達 ${towerBest}F)`, false];
  }
  if (m === 'train') { const L = LESSONS[settings.lesson]; return ['レッスン', `${settings.lesson + 1}. ${L.title}${lessonsDone[settings.lesson] ? ' ★' : ''}`, false]; }
  return ['', '— (このモードでは使いません)', true];
}
function drawMenu() {
  const f = game.frame;
  const titles = ['ぷ', 'よ', 'ぷ', 'よ'], cols = [1, 2, 3, 4];
  ctx.lineJoin = 'round';
  titles.forEach((t, i) => {
    const x = 330 + i * 110, y = 130 + Math.sin(f * 0.05 + i) * 6;
    ctx.font = `900 96px ${FONT}`; ctx.textAlign = 'center'; ctx.lineWidth = 12; ctx.strokeStyle = '#10143a'; ctx.strokeText(t, x, y);
    ctx.fillStyle = PAL[cols[i]].m; ctx.fillText(t, x, y);
  });
  text('2P対戦版', 500, 178, 30, '#ffffff', 'center');
  const pn = padInfo.length ? 'コントローラー  ' + padInfo.map((n, i) => `P${i + 1}: ${n}`).join('    ') : 'コントローラー未接続（有線でつないでボタンを押すと認識します）';
  text(pn, 500, 206, 14, padInfo.length ? '#8fe8a8' : '#8a91c8', 'center', false);

  const det = menuDetail(), m = settings.mode, free = m === 'tower' || m === 'train';
  const items = [
    ['モード', MODE_NAMES[m]],
    [det[0] || '詳細', det[1]],
    ['ぷよの色数', free ? '— (自動)' : settings.colors + '色'],
    ['落下スピード', m === 'train' ? '— (固定)' : ['ゆっくり', 'ふつう', 'はやい'][settings.speed]],
    ['オプション', '回転モーション・演出・音・ボイスなど ▶'],
    ['キー設定', '1P・2Pのキーを変更する ▶'],
    ['', 'スタート (Enter / Space)'],
  ];
  const bx = 200, bw = 600, y0 = 232;
  items.forEach((it, i) => {
    const y = y0 + i * 42, sel = game.sel === i, dim = (i === 1 && det[2]) || (i === 2 && free) || (i === 3 && m === 'train');
    rr(bx, y, bw, 34, 10);
    ctx.fillStyle = sel ? 'rgba(120,140,255,0.35)' : 'rgba(10,12,40,0.6)'; ctx.fill();
    ctx.lineWidth = 2; ctx.strokeStyle = sel ? '#aab6ff' : 'rgba(150,160,255,0.25)'; ctx.stroke();
    if (i === 6) text(it[1], bx + bw / 2, y + 25, 20, sel ? '#ffe14d' : '#fff', 'center');
    else {
      text(it[0], bx + 20, y + 24, 17, dim ? '#6a70a0' : '#b8beee');
      const arrow = sel && i < 4 && !dim;
      text((arrow ? '◀ ' : '') + it[1] + (arrow ? ' ▶' : ''), bx + bw - 20, y + 24, 17, dim ? '#6a70a0' : '#ffffff', 'right');
    }
  });
  const desc = {
    vs: '2人で対戦。連鎖でおじゃまぷよを送り合おう',
    cpu: 'CPUと対戦。強さは5段階',
    tower: '20階のタワーに挑戦!  3の倍数の階はミッション、5階ごとにボス戦。クリアした階は保存されます',
    train: '連鎖のコツを課題形式で練習。Hキーで置く場所のヒントを表示',
    solo: 'ひとりでスコアアタック。時間がたつほど落下が速くなります',
  }[m];
  text(desc, 500, 548, 15, '#ffd9a0', 'center', false);
  const lines = [
    '【1P】 ' + bindText(0),
    '【2P】 ' + bindText(1),
    'パッド(Switch Proコン/PS4・PS5など): 十字キー・スティック移動 / A・X・○・△・R=右回転 / B・Y・✕・□・L=左回転 / +・Options=ポーズ',
    'P / Esc: ポーズ   M: 効果音   V: ボイス   H: ヒント(特訓)   ※ひとり用・CPU戦は1P・2Pどちらのキーでも操作できます',
    '4つ以上つなげて消す → 連鎖で高得点 → おじゃまを送って攻撃(70点で1個) / 自分の連鎖で相殺 / 全消しで30個',
  ];
  lines.forEach((l, i) => text(l, 500, 586 + i * 22, 13, i === 4 ? '#ffd9a0' : '#b8beee', 'center', false));
  for (let i = 0; i < 14; i++) {
    const c = 1 + (i % 5), x = 50 + i * 68, y = 724 + Math.sin(f * 0.06 + i * 0.9) * 8;
    drawPuyo(x, y, c, 40, false);
  }
}
function drawOpts() {
  text('オプション', 500, 60, 40, '#ffffff', 'center');
  const bar = n => '■'.repeat(n) + '□'.repeat(10 - n) + '  ' + n;
  const onoff = v => v ? 'ON' : 'OFF';
  const rows = [
    ['回転モーション', ['なし (すぐ切り替え)', 'なめらか', 'バネ (ぷるん)'][settings.rotAnim]],
    ['連鎖演出の量', ['控えめ', 'ふつう', '派手'][settings.fx]],
    ['画面のゆれ', onoff(settings.shake)],
    ['コントローラー振動', onoff(settings.rumble)],
    ['横移動の速さ', ['ゆっくり', 'ふつう', 'はやい'][settings.das]],
    ['高速落下の速さ', ['ゆっくり', 'ふつう', 'はやい'][settings.soft]],
    ['着地ガイド', settings.guide ? 'あり' : 'なし'],
    ['効果音', onoff(settings.sound)],
    ['音量', bar(settings.vol)],
    ['ボイス', onoff(settings.voice)],
    ['おじゃまぷよの大きさ', Math.round(settings.ojScale * 100) + '%' + (settings.ojScale === 1 ? ' (標準)' : '')],
    ['', 'もどる (Esc)'],
  ];
  const bx = 200, bw = 600, y0 = 86;
  rows.forEach((it, i) => {
    const y = y0 + i * 36, sel = game.optSel === i;
    rr(bx, y, bw, 30, 9); ctx.fillStyle = sel ? 'rgba(120,140,255,0.35)' : 'rgba(10,12,40,0.6)'; ctx.fill();
    ctx.lineWidth = 2; ctx.strokeStyle = sel ? '#aab6ff' : 'rgba(150,160,255,0.25)'; ctx.stroke();
    if (i === OPT_N - 1) { text(it[1], bx + bw / 2, y + 22, 18, sel ? '#ffe14d' : '#fff', 'center'); return; }
    text(it[0], bx + 20, y + 21, 16, '#b8beee');
    const arrow = sel;
    text((arrow ? '◀ ' : '') + it[1] + (arrow ? ' ▶' : ''), bx + bw - 20, y + 21, 16, '#ffffff', 'right');
  });
  wrapLines(OPT_DESC[game.optSel], 14, 760).forEach((l, i) => text(l, 500, 540 + i * 20, 14, '#ffd9a0', 'center', false));
  const by = 584, bh = 170;
  panel(200, by, 290, bh); panel(510, by, 290, bh);
  text('回転モーションの確認', 345, by + 24, 14, '#9fa6e0', 'center');
  text('おじゃまぷよの大きさの確認', 655, by + 24, 14, '#9fa6e0', 'center');
  const d = game.demo;
  if (d) {
    ctx.save(); ctx.beginPath(); ctx.rect(200, by + 32, 290, bh - 36); ctx.clip();
    drawLivePair(345, by + 100, d, 46, 0, false);
    ctx.restore();
  }
  [1, 2, 6, 3, 6].forEach((c, i) => {
    const x = 540 + i * 56, y = by + 100;
    ctx.strokeStyle = 'rgba(255,255,255,0.12)'; ctx.strokeRect(x - 26, y - 26, 52, 52);
    drawPuyo(x, y, c, 52, false);
  });
  text('白い枠(1マス)に対して、ぷよとおじゃまが同じ大きさに見えればOK', 655, by + 150, 11, '#8a91c8', 'center', false);
}

function drawKeys() {
  text('キー設定', 500, 74, 44, '#ffffff', 'center');
  text('項目を選んで Enter → 割り当てたいキーを押す (Esc でキャンセル) 取り合いになったキーは自動で入れ替わります', 500, 106, 15, '#b8beee', 'center', false);
  for (let pi = 0; pi < 2; pi++) {
    const x = pi === 0 ? 60 : 520, w = 420;
    text(pi === 0 ? 'PLAYER 1' : 'PLAYER 2', x + w / 2, 150, 22, pi === 0 ? '#ff7f8f' : '#6fc6ff', 'center');
    ACTS.forEach((a, i) => {
      const idx = pi * 5 + i, y = 164 + i * 50, sel = game.keySel === idx;
      rr(x, y, w, 40, 10); ctx.fillStyle = sel ? 'rgba(120,140,255,0.38)' : 'rgba(10,12,40,0.6)'; ctx.fill();
      ctx.lineWidth = 2; ctx.strokeStyle = sel ? '#aab6ff' : 'rgba(150,160,255,0.25)'; ctx.stroke();
      text(ACT_LABEL[a], x + 18, y + 27, 19, '#b8beee');
      const waiting = sel && game.bindWait;
      text(waiting ? 'キーを押してください…' : bindStr(pi, a), x + w - 18, y + 27, 20, waiting ? '#ffe14d' : '#ffffff', 'right');
    });
  }
  const btns = ['1Pと2Pのキーを入れ替える', '初期設定に戻す', '戻る (Esc)'];
  btns.forEach((b, i) => {
    const idx = 10 + i, y = 440 + i * 52, sel = game.keySel === idx;
    rr(300, y, 400, 42, 10); ctx.fillStyle = sel ? 'rgba(120,140,255,0.38)' : 'rgba(10,12,40,0.6)'; ctx.fill();
    ctx.lineWidth = 2; ctx.strokeStyle = sel ? '#aab6ff' : 'rgba(150,160,255,0.25)'; ctx.stroke();
    text(b, 500, y + 28, 20, sel ? '#ffe14d' : '#ffffff', 'center');
  });
  text('↑↓: 項目選択 ←→: 1P/2Pの切り替え 設定はこのブラウザに自動保存されます', 500, 640, 15, '#8a91c8', 'center', false);
  text('※ P・M・Esc・Enter・Space・Backspace・Tab は使えません', 500, 666, 14, '#8a91c8', 'center', false);
  text('※ ひとり用は1P・2P両方のキーで操作できます', 500, 690, 14, '#8a91c8', 'center', false);
}

function drawToast() {
  if (game.frame >= padToast.until || !padToast.text) return;
  ctx.font = `bold 16px ${FONT}`;
  const w = ctx.measureText(padToast.text).width + 36;
  rr(500 - w / 2, 8, w, 32, 16); ctx.fillStyle = 'rgba(20,30,70,0.92)'; ctx.fill();
  ctx.lineWidth = 2; ctx.strokeStyle = '#8fe8a8'; ctx.stroke();
  text(padToast.text, 500, 30, 16, '#d8ffe6', 'center');
}

function render() {
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  drawBackground();
  if (game.scene === 'menu') { drawMenu(); drawToast(); return; }
  if (game.scene === 'keys') { drawKeys(); drawToast(); return; }
  if (game.scene === 'opts') { drawOpts(); drawToast(); return; }

  ctx.save();
  if (game.shake > 0 && settings.shake) ctx.translate((Math.random() - 0.5) * game.shake * 1.4, (Math.random() - 0.5) * game.shake * 1.4);
  game.players.forEach(drawInfoPanel);
  game.players.forEach(drawPlayer);
  drawShots();
  game.players.forEach(drawCutin);
  for (const sh of game.shock) {
    const k = sh.t / sh.life, e = 1 - Math.pow(1 - k, 3);
    ctx.globalAlpha = (1 - k) * 0.8; ctx.strokeStyle = sh.color; ctx.lineWidth = 14 * (1 - k) + 2;
    ctx.beginPath(); ctx.arc(sh.x, sh.y, 30 + e * 700, 0, Math.PI * 2); ctx.stroke();
    ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 4 * (1 - k); ctx.beginPath(); ctx.arc(sh.x, sh.y, 10 + e * 640, 0, Math.PI * 2); ctx.stroke();
  }
  ctx.globalAlpha = 1;
  ctx.restore();
  if (game.flash > 0.01) { ctx.fillStyle = `rgba(255,255,255,${game.flash})`; ctx.fillRect(0, 0, W, H); }

  if (game.players.length === 2) {
    const ti = game.towerInfo;
    if (ti) {
      text('TOWER', 500, 318, 15, '#9fa6e0', 'center'); text(ti.f + 'F', 500, 366, 44, ti.boss ? '#ff9a4a' : '#ffffff', 'center');
      if (ti.boss) text('BOSS', 500, 392, 16, '#ff9a4a', 'center');
    } else {
      text('VS', 500, 330, 44, '#ffffff', 'center');
      text(`${game.wins[0]} - ${game.wins[1]}`, 500, 372, 26, '#b8beee', 'center');
    }
  }
  drawSplash();
  let hint = settings.mode !== 'vs'
    ? `${bindText(0)} (1P・2P両方のキーで操作可) P: ポーズ M: 音 V: ボイス${game.lesson ? ' H: ヒント' : ''}`
    : `1P: ${bindStr(0, 'left')}${bindStr(0, 'right')}${bindStr(0, 'down')} / 回転 ${bindStr(0, 'cw')}・${bindStr(0, 'ccw')} 2P: ${bindStr(1, 'left')}${bindStr(1, 'right')}${bindStr(1, 'down')} / 回転 ${bindStr(1, 'cw')}・${bindStr(1, 'ccw')} P: ポーズ M: 音`;
  if (game.over) hint = overHint();
  text(hint, 500, 764, 14, game.over ? '#ffe14d' : '#8a91c8', 'center', game.over);
  if (game.paused) {
    ctx.fillStyle = 'rgba(0,0,10,0.72)'; ctx.fillRect(0, 0, W, H);
    text('PAUSE', 500, 360, 72, '#ffffff', 'center');
    text('P / Esc / パッドの+: 再開  Backspace / パッドの−: メニューへ戻る', 500, 410, 22, '#b8beee', 'center', false);
  }
  drawToast();
}

let last = performance.now(), acc = 0;
const DT = 1000 / 60;
function frameLoop(now) {
  acc += Math.min(100, now - last); last = now;
  while (acc >= DT) { step(); acc -= DT; }
  render();
  requestAnimationFrame(frameLoop);
}
requestAnimationFrame(frameLoop);
</script>
