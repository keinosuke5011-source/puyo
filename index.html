<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>ぽにょんぽにょん 2P対戦版</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
        }
        
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #0f172a; /* Slate 900 */
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* 画面全体にフィットするレスポンシブキャンバスラッパー */
        .game-wrapper {
            position: relative;
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 8px;
        }

        /* アスペクト比1000:772を維持しながら縦横最大の領域にフィット */
        canvas {
            aspect-ratio: 1000 / 772;
            width: auto;
            height: auto;
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
            border-radius: 16px;
            background-color: #1e293b;
        }

        /* タッチコントローラー（モバイル用オーバーレイ） */
        .touch-controls {
            position: absolute;
            bottom: 12px;
            left: 50%;
            transform: translateX(-50%);
            width: 95%;
            max-width: 980px;
            display: none; /* JSで画面サイズやタッチ検知に応じて表示 */
            justify-content: space-between;
            pointer-events: none;
            z-index: 20;
        }

        .touch-btn {
            pointer-events: auto;
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(8px);
            border: 2px solid rgba(255, 255, 255, 0.4);
            color: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            active:scale-95;
            transition: transform 0.05s;
        }

        .touch-btn:active {
            background: rgba(255, 255, 255, 0.4);
            transform: scale(0.92);
        }
    </style>
</head>
<body>

    <div class="game-wrapper">
        <canvas id="gameCanvas" width="1000" height="772"></canvas>
    </div>

    <!-- ゲームロジック実装 -->
    <script>
        window.onload = function() {
            const canvas = document.getElementById('gameCanvas');
            const ctx = canvas.getContext('2d');

            // --- ゲーム定数定義 ---
            const BOARD_COLS = 6;
            const BOARD_ROWS = 12;
            const BLOCK_SIZE = 40; // 内部描画基準サイズ
            
            // 下キーでの落下インターバル（フレーム数）。値を大きくして滑らか＆低速調整（誤爆防止）
            const SOFT_DROP_INTERVAL = 6; // 通常落下(30~40)より速いが、制御不能にならないマイルドな速度

            // 色の定義 (0: 空白, 1: 赤, 2: 青, 3: 緑, 4: 黄, 5: 紫, 9: お邪魔)
            const COLORS = {
                0: null,
                1: { main: '#ef4444', light: '#fca5a5', shadow: '#991b1b', eye: '#ffffff' }, // 赤
                2: { main: '#3b82f6', light: '#93c5fd', shadow: '#1e40af', eye: '#ffffff' }, // 青
                3: { main: '#22c55e', light: '#86efac', shadow: '#15803d', eye: '#ffffff' }, // 緑
                4: { main: '#eab308', light: '#fde047', shadow: '#a16207', eye: '#ffffff' }, // 黄
                5: { main: '#a855f7', light: '#d8b4fe', shadow: '#6b21a8', eye: '#ffffff' }, // 紫
                9: { main: '#94a3b8', light: '#cbd5e1', shadow: '#475569', eye: '#334155' }  // お邪魔ぷよ
            };

            // ゲーム状態
            const STATE = {
                MENU: 'MENU',
                PLAYING: 'PLAYING',
                GAMEOVER: 'GAMEOVER'
            };

            let currentState = STATE.MENU;
            let gameMode = '2P'; // '2P', 'CPU', '1P'
            
            // キー入力検知状態
            const keys = {};

            // 音声効果 (Web Audio API で自作効果音)
            const AudioCtx = window.AudioContext || window.webkitAudioContext;
            let audioCtx = null;

            function playSound(type) {
                if (!audioCtx) return;
                try {
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.connect(gain);
                    gain.connect(audioCtx.destination);

                    const now = audioCtx.currentTime;
                    if (type === 'move') {
                        osc.frequency.setValueAtTime(300, now);
                        osc.frequency.exponentialRampToValueAtTime(150, now + 0.05);
                        gain.gain.setValueAtTime(0.1, now);
                        gain.gain.linearRampToValueAtTime(0, now + 0.05);
                        osc.start(now);
                        osc.stop(now + 0.05);
                    } else if (type === 'rotate') {
                        osc.frequency.setValueAtTime(400, now);
                        osc.frequency.exponentialRampToValueAtTime(600, now + 0.06);
                        gain.gain.setValueAtTime(0.1, now);
                        gain.gain.linearRampToValueAtTime(0, now + 0.06);
                        osc.start(now);
                        osc.stop(now + 0.06);
                    } else if (type === 'pop') {
                        osc.frequency.setValueAtTime(523.25, now); // C5
                        osc.frequency.exponentialRampToValueAtTime(1046.5, now + 0.15); // C6
                        gain.gain.setValueAtTime(0.2, now);
                        gain.gain.linearRampToValueAtTime(0, now + 0.15);
                        osc.start(now);
                        osc.stop(now + 0.15);
                    } else if (type === 'win') {
                        osc.type = 'triangle';
                        osc.frequency.setValueAtTime(440, now);
                        osc.frequency.setValueAtTime(554.37, now + 0.1);
                        osc.frequency.setValueAtTime(659.25, now + 0.2);
                        osc.frequency.setValueAtTime(880, now + 0.3);
                        gain.gain.setValueAtTime(0.2, now);
                        gain.gain.linearRampToValueAtTime(0, now + 0.6);
                        osc.start(now);
                        osc.stop(now + 0.6);
                    }
                } catch (e) { console.error(e); }
            }

            function initAudio() {
                if (!audioCtx) {
                    audioCtx = new AudioCtx();
                }
                if (audioCtx.state === 'suspended') {
                    audioCtx.resume();
                }
            }

            // --- プレイヤーオブジェクト構造 ---
            class Player {
                constructor(id, offsetX, isCPU = false) {
                    this.id = id;
                    this.offsetX = offsetX;
                    this.offsetY = 120;
                    this.isCPU = isCPU;
                    this.reset();
                }

                reset() {
                    this.board = Array(BOARD_ROWS).fill(null).map(() => Array(BOARD_COLS).fill(0));
                    this.score = 0;
                    this.chainCount = 0;
                    this.garbageToDrop = 0; // 降る予定のお邪魔ぷよ数
                    this.currentPair = null;
                    this.nextPair = this.generatePair();
                    this.spawnPair();
                    
                    this.dropTimer = 0;
                    this.dropInterval = 35; // 通常落下スピード（フレーム数）
                    this.softDropCounter = 0;

                    this.isEliminating = false;
                    this.animFrames = 0;
                    this.poppingBlocks = [];
                    this.winner = false;
                    this.loser = false;

                    // AI用
                    this.cpuTimer = 0;
                    this.cpuTargetX = 2;
                    this.cpuTargetRot = 0;
                }

                generatePair() {
                    const colors = [1, 2, 3, 4]; // 4色
                    const c1 = colors[Math.floor(Math.random() * colors.length)];
                    const c2 = colors[Math.floor(Math.random() * colors.length)];
                    return {
                        x: 2,
                        y: 0,
                        rot: 0, // 0: 上, 1: 右, 2: 下, 3: 左
                        c1: c1, // 軸ぷよ
                        c2: c2  // 子ぷよ
                    };
                }

                spawnPair() {
                    this.currentPair = this.nextPair;
                    this.nextPair = this.generatePair();
                    
                    // 敗北判定（出現位置が埋まっているか）
                    if (this.board[0][2] !== 0) {
                        this.loser = true;
                    }

                    if (this.isCPU) {
                        this.decideCPUMove();
                    }
                }

                // 子ぷよの相対座標を取得
                getOtherPos(x, y, rot) {
                    let ox = x;
                    let oy = y;
                    if (rot === 0) oy -= 1;
                    else if (rot === 1) ox += 1;
                    else if (rot === 2) oy += 1;
                    else if (rot === 3) ox -= 1;
                    return { ox, oy };
                }

                // 衝突判定
                canMove(x, y, rot) {
                    const { ox, oy } = this.getOtherPos(x, y, rot);

                    // 軸ぷよの範囲・判定
                    if (x < 0 || x >= BOARD_COLS || y >= BOARD_ROWS) return false;
                    if (y >= 0 && this.board[y][x] !== 0) return false;

                    // 子ぷよの範囲・判定
                    if (ox < 0 || ox >= BOARD_COLS || oy >= BOARD_ROWS) return false;
                    if (oy >= 0 && this.board[oy][ox] !== 0) return false;

                    return true;
                }

                // 移動処理
                moveLeft() {
                    if (this.canMove(this.currentPair.x - 1, this.currentPair.y, this.currentPair.rot)) {
                        this.currentPair.x--;
                        playSound('move');
                        return true;
                    }
                    return false;
                }

                moveRight() {
                    if (this.canMove(this.currentPair.x + 1, this.currentPair.y, this.currentPair.rot)) {
                        this.currentPair.x++;
                        playSound('move');
                        return true;
                    }
                    return false;
                }

                rotate(dir) { // dir: 1 (時計回り), -1 (反時計回り)
                    const newRot = (this.currentPair.rot + dir + 4) % 4;
                    // 通常回転
                    if (this.canMove(this.currentPair.x, this.currentPair.y, newRot)) {
                        this.currentPair.rot = newRot;
                        playSound('rotate');
                        return;
                    }
                    // 壁蹴り (横に1マスずらして回転可能か試す)
                    if (this.canMove(this.currentPair.x - 1, this.currentPair.y, newRot)) {
                        this.currentPair.x--;
                        this.currentPair.rot = newRot;
                        playSound('rotate');
                        return;
                    }
                    if (this.canMove(this.currentPair.x + 1, this.currentPair.y, newRot)) {
                        this.currentPair.x++;
                        this.currentPair.rot = newRot;
                        playSound('rotate');
                        return;
                    }
                }

                // 設置・固定
                lockPair() {
                    const { x, y, rot, c1, c2 } = this.currentPair;
                    const { ox, oy } = this.getOtherPos(x, y, rot);

                    if (y >= 0) this.board[y][x] = c1;
                    if (oy >= 0) this.board[oy][ox] = c2;

                    this.currentPair = null;
                    this.applyGravity();
                    this.chainCount = 0;
                    this.checkChain();
                }

                // 重力処理（空中に浮いているぷよを落とす）
                applyGravity() {
                    let moved = false;
                    for (let col = 0; col < BOARD_COLS; col++) {
                        for (let row = BOARD_ROWS - 2; row >= 0; row--) {
                            if (this.board[row][col] !== 0) {
                                let targetRow = row;
                                while (targetRow + 1 < BOARD_ROWS && this.board[targetRow + 1][col] === 0) {
                                    targetRow++;
                                }
                                if (targetRow !== row) {
                                    this.board[targetRow][col] = this.board[row][col];
                                    this.board[row][col] = 0;
                                    moved = true;
                                }
                            }
                        }
                    }
                    return moved;
                }

                // 連鎖チェックと消去
                checkChain() {
                    const visited = Array(BOARD_ROWS).fill(null).map(() => Array(BOARD_COLS).fill(false));
                    let toErase = [];

                    for (let r = 0; r < BOARD_ROWS; r++) {
                        for (let c = 0; c < BOARD_COLS; c++) {
                            const color = this.board[r][c];
                            if (color > 0 && color !== 9 && !visited[r][c]) {
                                const group = [];
                                this.findConnected(r, c, color, visited, group);
                                if (group.length >= 4) {
                                    toErase = toErase.concat(group);
                                }
                            }
                        }
                    }

                    if (toErase.length > 0) {
                        this.chainCount++;
                        playSound('pop');
                        
                        // 消去スコア計算
                        this.score += toErase.length * 10 * Math.pow(2, this.chainCount);

                        // お邪魔ぷよ発生計算 (相手へ送る)
                        if (gameMode !== '1P') {
                            const targetPlayer = (this.id === 1) ? player2 : player1;
                            const garbageAmount = Math.floor(toErase.length * (this.chainCount * 0.75));
                            targetPlayer.garbageToDrop += garbageAmount;
                        }

                        // お邪魔ぷよの巻き込み消去チェック
                        const eraseMap = Array(BOARD_ROWS).fill(null).map(() => Array(BOARD_COLS).fill(false));
                        toErase.forEach(p => eraseMap[p.r][p.c] = true);

                        // 隣接するお邪魔ぷよも消去リストに追加
                        toErase.forEach(p => {
                            const dirs = [[-1,0],[1,0],[0,-1],[0,1]];
                            dirs.forEach(([dr, dc]) => {
                                const nr = p.r + dr;
                                const nc = p.c + dc;
                                if (nr >= 0 && nr < BOARD_ROWS && nc >= 0 && nc < BOARD_COLS) {
                                    if (this.board[nr][nc] === 9) {
                                        eraseMap[nr][nc] = true;
                                    }
                                }
                            });
                        });

                        // 盤面から消去
                        for (let r = 0; r < BOARD_ROWS; r++) {
                            for (let c = 0; c < BOARD_COLS; c++) {
                                if (eraseMap[r][c]) {
                                    this.board[r][c] = 0;
                                }
                            }
                        }

                        // アニメーション・重力・再帰連鎖
                        setTimeout(() => {
                            this.applyGravity();
                            this.checkChain();
                        }, 250);

                    } else {
                        // 連鎖終了時にお邪魔ぷよを降らせる
                        if (this.garbageToDrop > 0) {
                            this.dropGarbage();
                        }
                        // 次のぷよ出現
                        this.spawnPair();
                    }
                }

                // 同色連結探索 (DFS)
                findConnected(r, c, color, visited, group) {
                    visited[r][c] = true;
                    group.push({ r, c });

                    const dirs = [[-1,0],[1,0],[0,-1],[0,1]];
                    for (const [dr, dc] of dirs) {
                        const nr = r + dr;
                        const nc = c + dc;
                        if (nr >= 0 && nr < BOARD_ROWS && nc >= 0 && nc < BOARD_COLS) {
                            if (!visited[nr][nc] && this.board[nr][nc] === color) {
                                this.findConnected(nr, nc, color, visited, group);
                            }
                        }
                    }
                }

                // お邪魔ぷよを上から降らせる
                dropGarbage() {
                    let amount = Math.min(this.garbageToDrop, 18); // 一度に降る上限
                    this.garbageToDrop -= amount;

                    while (amount > 0) {
                        const cols = [0, 1, 2, 3, 4, 5].sort(() => Math.random() - 0.5);
                        for (let c of cols) {
                            if (amount <= 0) break;
                            for (let r = 0; r < BOARD_ROWS; r++) {
                                if (this.board[r][c] === 0) {
                                    this.board[r][c] = 9; // お邪魔ぷよ
                                    amount--;
                                    break;
                                }
                            }
                        }
                    }
                    this.applyGravity();
                }

                // 簡易CPUロジック
                decideCPUMove() {
                    // ランダムかつ少し賢く位置を選択
                    this.cpuTargetX = Math.floor(Math.random() * BOARD_COLS);
                    this.cpuTargetRot = Math.floor(Math.random() * 4);
                }

                updateCPU() {
                    if (!this.currentPair) return;
                    this.cpuTimer++;
                    if (this.cpuTimer % 8 === 0) {
                        // 回転
                        if (this.currentPair.rot !== this.cpuTargetRot) {
                            this.rotate(1);
                        }
                        // 横移動
                        else if (this.currentPair.x < this.cpuTargetX) {
                            this.moveRight();
                        } else if (this.currentPair.x > this.cpuTargetX) {
                            this.moveLeft();
                        }
                    }
                }

                // 毎フレーム更新
                update() {
                    if (this.loser || this.winner) return;

                    if (this.isCPU) {
                        this.updateCPU();
                    }

                    if (!this.currentPair) return;

                    // 自動落下処理
                    this.dropTimer++;
                    if (this.dropTimer >= this.dropInterval) {
                        this.dropTimer = 0;
                        if (this.canMove(this.currentPair.x, this.currentPair.y + 1, this.currentPair.rot)) {
                            this.currentPair.y++;
                        } else {
                            this.lockPair();
                        }
                    }
                }

                // マイルドな高速落下（誤爆防止用に調整された呼び出し関数）
                softDrop() {
                    if (!this.currentPair) return;
                    this.softDropCounter++;
                    if (this.softDropCounter >= SOFT_DROP_INTERVAL) {
                        this.softDropCounter = 0;
                        if (this.canMove(this.currentPair.x, this.currentPair.y + 1, this.currentPair.rot)) {
                            this.currentPair.y++;
                            this.score += 1; // 高速落下ボーナス
                        } else {
                            this.lockPair();
                        }
                    }
                }
            }

            // プレイヤー1・2の作成
            const player1 = new Player(1, 80);
            const player2 = new Player(2, 560);

            // --- キーボード操作ハンドラー ---
            window.addEventListener('keydown', (e) => {
                initAudio();
                if (currentState !== STATE.PLAYING) return;

                keys[e.code] = true;

                // 1P 操作 (WASD + Shift/Space) または 矢印キー（1Pモード時）
                if (gameMode === '1P') {
                    if (e.code === 'ArrowLeft' || e.code === 'KeyA') player1.moveLeft();
                    if (e.code === 'ArrowRight' || e.code === 'KeyD') player1.moveRight();
                    if (e.code === 'ArrowUp' || e.code === 'KeyW' || e.code === 'Space') player1.rotate(1);
                } else {
                    // 2P対戦/CPU戦の1P (WASD)
                    if (e.code === 'KeyA') player1.moveLeft();
                    if (e.code === 'KeyD') player1.moveRight();
                    if (e.code === 'KeyW') player1.rotate(1);

                    // 2P操作 (矢印キー - ふたりで対戦時のみ)
                    if (gameMode === '2P') {
                        if (e.code === 'ArrowLeft') player2.moveLeft();
                        if (e.code === 'ArrowRight') player2.moveRight();
                        if (e.code === 'ArrowUp') player2.rotate(1);
                    }
                }
            });

            window.addEventListener('keyup', (e) => {
                keys[e.code] = false;
            });

            // マウス/タッチでメニュー選択 & 画面クリック時の音声有効化
            canvas.addEventListener('click', (e) => {
                initAudio();
                const rect = canvas.getBoundingClientRect();
                const scaleX = canvas.width / rect.width;
                const scaleY = canvas.height / rect.height;
                const mouseX = (e.clientX - rect.left) * scaleX;
                const mouseY = (e.clientY - rect.top) * scaleY;

                if (currentState === STATE.MENU) {
                    // モード選択ボタンのヒット判定
                    if (mouseX >= 320 && mouseX <= 680) {
                        if (mouseY >= 320 && mouseY <= 390) {
                            startGame('2P');
                        } else if (mouseY >= 410 && mouseY <= 480) {
                            startGame('CPU');
                        } else if (mouseY >= 500 && mouseY <= 570) {
                            startGame('1P');
                        }
                    }
                } else if (currentState === STATE.GAMEOVER) {
                    // リトライボタン
                    if (mouseX >= 380 && mouseX <= 620 && mouseY >= 500 && mouseY <= 570) {
                        currentState = STATE.MENU;
                    }
                }
            });

            function startGame(mode) {
                gameMode = mode;
                player1.reset();
                player2.reset();
                player2.isCPU = (mode === 'CPU');
                currentState = STATE.PLAYING;
            }

            // --- 描画関数群 ---

            // ぷよ単体の描画（ぽにょぽにょ感のある丸みと目線）
            function drawPuyo(ctx, x, y, colorId, scale = 1) {
                if (!colorId || colorId === 0) return;

                const theme = COLORS[colorId];
                const radius = (BLOCK_SIZE / 2) * scale;
                const cx = x + BLOCK_SIZE / 2;
                const cy = y + BLOCK_SIZE / 2;

                ctx.save();

                // 本体ベース（グラデーション風円形）
                ctx.beginPath();
                ctx.arc(cx, cy, radius - 2, 0, Math.PI * 2);
                ctx.fillStyle = theme.main;
                ctx.fill();

                // ハイライト（立体感）
                ctx.beginPath();
                ctx.arc(cx - radius * 0.3, cy - radius * 0.3, radius * 0.35, 0, Math.PI * 2);
                ctx.fillStyle = theme.light;
                ctx.fill();

                // 目（お邪魔ぷよ以外）
                if (colorId !== 9) {
                    ctx.fillStyle = theme.eye;
                    // 左目
                    ctx.beginPath();
                    ctx.arc(cx - radius * 0.3, cy - radius * 0.1, radius * 0.22, 0, Math.PI * 2);
                    ctx.fill();
                    // 右目
                    ctx.beginPath();
                    ctx.arc(cx + radius * 0.3, cy - radius * 0.1, radius * 0.22, 0, Math.PI * 2);
                    ctx.fill();

                    // 黒目
                    ctx.fillStyle = '#1e293b';
                    ctx.beginPath();
                    ctx.arc(cx - radius * 0.25, cy - radius * 0.1, radius * 0.1, 0, Math.PI * 2);
                    ctx.arc(cx + radius * 0.35, cy - radius * 0.1, radius * 0.1, 0, Math.PI * 2);
                    ctx.fill();
                } else {
                    // お邪魔ぷよの目（×目）
                    ctx.strokeStyle = theme.eye;
                    ctx.lineWidth = 3;
                    ctx.beginPath();
                    ctx.moveTo(cx - 8, cy - 8); ctx.lineTo(cx + 8, cy + 8);
                    ctx.moveTo(cx + 8, cy - 8); ctx.lineTo(cx - 8, cy + 8);
                    ctx.stroke();
                }

                ctx.restore();
            }

            // プレイヤーフィールドの描画
            function drawBoard(player) {
                const { offsetX, offsetY, board, currentPair, nextPair, score, garbageToDrop, id } = player;

                // 枠外背景・フィールド枠
                ctx.fillStyle = 'rgba(15, 23, 42, 0.75)';
                ctx.roundRect(offsetX - 10, offsetY - 10, BOARD_COLS * BLOCK_SIZE + 20, BOARD_ROWS * BLOCK_SIZE + 20, 12);
                ctx.fill();
                ctx.strokeStyle = '#334155';
                ctx.lineWidth = 4;
                ctx.stroke();

                // 盤面格子描画
                for (let r = 0; r < BOARD_ROWS; r++) {
                    for (let c = 0; c < BOARD_COLS; c++) {
                        ctx.strokeStyle = 'rgba(255, 255, 255, 0.05)';
                        ctx.strokeRect(offsetX + c * BLOCK_SIZE, offsetY + r * BLOCK_SIZE, BLOCK_SIZE, BLOCK_SIZE);
                        
                        // 設置されたぷよ
                        if (board[r][c] !== 0) {
                            drawPuyo(ctx, offsetX + c * BLOCK_SIZE, offsetY + r * BLOCK_SIZE, board[r][c]);
                        }
                    }
                }

                // 操作中のぷよペアの描画
                if (currentPair) {
                    const { x, y, rot, c1, c2 } = currentPair;
                    const { ox, oy } = player.getOtherPos(x, y, rot);

                    if (y >= 0) drawPuyo(ctx, offsetX + x * BLOCK_SIZE, offsetY + y * BLOCK_SIZE, c1);
                    if (oy >= 0) drawPuyo(ctx, offsetX + ox * BLOCK_SIZE, offsetY + oy * BLOCK_SIZE, c2);
                }

                // NEXT枠
                const nextBoxX = (id === 1) ? offsetX + BOARD_COLS * BLOCK_SIZE + 20 : offsetX - 90;
                const nextBoxY = offsetY + 10;
                ctx.fillStyle = 'rgba(30, 41, 59, 0.9)';
                ctx.roundRect(nextBoxX, nextBoxY, 70, 110, 10);
                ctx.fill();
                ctx.strokeStyle = '#475569';
                ctx.lineWidth = 2;
                ctx.stroke();

                ctx.fillStyle = '#94a3b8';
                ctx.font = 'bold 12px sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText('NEXT', nextBoxX + 35, nextBoxY + 20);

                if (nextPair) {
                    drawPuyo(ctx, nextBoxX + 15, nextBoxY + 30, nextPair.c2, 0.8);
                    drawPuyo(ctx, nextBoxX + 15, nextBoxY + 65, nextPair.c1, 0.8);
                }

                // スコア & プレイヤーラベル
                ctx.fillStyle = '#f8fafc';
                ctx.font = 'bold 20px sans-serif';
                ctx.textAlign = 'left';
                const label = (id === 1) ? '1P' : (gameMode === 'CPU' ? 'CPU' : '2P');
                ctx.fillText(`${label}`, offsetX, offsetY - 25);

                ctx.textAlign = 'right';
                ctx.fillText(`${score} pts`, offsetX + BOARD_COLS * BLOCK_SIZE, offsetY - 25);

                // 予告お邪魔ぷよ表示
                if (garbageToDrop > 0) {
                    ctx.fillStyle = '#ef4444';
                    ctx.font = 'bold 14px sans-serif';
                    ctx.textAlign = 'left';
                    ctx.fillText(`予告お邪魔: ${garbageToDrop}`, offsetX, offsetY + BOARD_ROWS * BLOCK_SIZE + 25);
                }
            }

            // メニュー画面の描画
            function drawMenu() {
                ctx.fillStyle = 'rgba(15, 23, 42, 0.85)';
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                // タイトルロゴ
                ctx.fillStyle = '#38bdf8';
                ctx.font = 'black 54px sans-serif';
                ctx.textAlign = 'center';
                ctx.shadowColor = '#0284c7';
                ctx.shadowBlur = 20;
                ctx.fillText('ぽにょんぽにょん', canvas.width / 2, 180);
                ctx.shadowBlur = 0;

                ctx.fillStyle = '#cbd5e1';
                ctx.font = 'bold 24px sans-serif';
                ctx.fillText('2P対戦版', canvas.width / 2, 230);

                // ボタン描画ヘルパー
                function drawButton(y, text, colorBg, colorHover) {
                    ctx.fillStyle = colorBg;
                    ctx.roundRect(320, y, 360, 70, 16);
                    ctx.fill();
                    ctx.strokeStyle = 'rgba(255,255,255,0.3)';
                    ctx.lineWidth = 2;
                    ctx.stroke();

                    ctx.fillStyle = '#ffffff';
                    ctx.font = 'bold 22px sans-serif';
                    ctx.textAlign = 'center';
                    ctx.fillText(text, canvas.width / 2, y + 43);
                }

                drawButton(320, 'ふたりで対戦 (2P)', '#2563eb');
                drawButton(410, 'CPUと対戦 (1P vs CPU)', '#0d9488');
                drawButton(500, 'ひとりでスコアアタック', '#4f46e5');

                ctx.fillStyle = '#94a3b8';
                ctx.font = '14px sans-serif';
                ctx.fillText('画面クリックまたはタップで選択してください', canvas.width / 2, 630);
                ctx.fillText('【操作】 1P: A/D(移動) W(回転) S(落下) | 2P: 矢印キー', canvas.width / 2, 660);
            }

            // 勝敗・ゲームオーバー画面描画
            function drawGameOver() {
                ctx.fillStyle = 'rgba(15, 23, 42, 0.75)';
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                ctx.fillStyle = '#ffffff';
                ctx.font = 'bold 48px sans-serif';
                ctx.textAlign = 'center';

                let winnerText = '';
                if (gameMode === '1P') {
                    winnerText = 'ゲームオーバー！';
                } else if (player1.loser && player2.loser) {
                    winnerText = '引き分け！';
                } else if (player1.loser) {
                    winnerText = (gameMode === 'CPU' ? 'CPU' : '2P') + ' の勝利！';
                } else if (player2.loser) {
                    winnerText = '1P の勝利！';
                }

                ctx.fillText(winnerText, canvas.width / 2, 320);

                // リトライボタン
                ctx.fillStyle = '#22c55e';
                ctx.roundRect(380, 500, 240, 70, 16);
                ctx.fill();

                ctx.fillStyle = '#ffffff';
                ctx.font = 'bold 22px sans-serif';
                ctx.fillText('メニューへ戻る', canvas.width / 2, 543);
            }

            // --- メインゲームループ ---
            function gameLoop() {
                // 画面クリア
                ctx.clearRect(0, 0, canvas.width, canvas.height);

                // 背景デザイン（グラデーション）
                const bgGrad = ctx.createLinearGradient(0, 0, 0, canvas.height);
                bgGrad.addColorStop(0, '#0f172a');
                bgGrad.addColorStop(1, '#1e1b4b');
                ctx.fillStyle = bgGrad;
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                if (currentState === STATE.MENU) {
                    drawMenu();
                } else if (currentState === STATE.PLAYING || currentState === STATE.GAMEOVER) {
                    
                    // 下キー長押しでのマイルド落下（ソフトドロップ）
                    if (currentState === STATE.PLAYING) {
                        if (keys['KeyS']) player1.softDrop();
                        if (gameMode === '1P' && keys['ArrowDown']) player1.softDrop();
                        if (gameMode === '2P' && keys['ArrowDown']) player2.softDrop();

                        player1.update();
                        if (gameMode !== '1P') {
                            player2.update();
                        }

                        // 勝敗判定
                        if (player1.loser || player2.loser) {
                            currentState = STATE.GAMEOVER;
                            if (player1.loser && !player2.loser) playSound('win');
                            else if (player2.loser && !player1.loser) playSound('win');
                        }
                    }

                    // 描画
                    if (gameMode === '1P') {
                        // 1Pのみ中央配置
                        player1.offsetX = 380;
                        drawBoard(player1);
                    } else {
                        player1.offsetX = 100;
                        player2.offsetX = 560;
                        drawBoard(player1);
                        drawBoard(player2);
                    }

                    if (currentState === STATE.GAMEOVER) {
                        drawGameOver();
                    }
                }

                requestAnimationFrame(gameLoop);
            }

            // ループ開始
            requestAnimationFrame(gameLoop);
        };
    </script>
</body>
</html>
